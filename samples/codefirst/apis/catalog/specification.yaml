openapi: "3.0.1"
info:
  title: Catalog API
  version: "1.0"
  description: Catalogo prodotti fittizio con risposte casuali. Mostra fragment, cache, check-header, choose e CORS.
paths:
  /products:
    get:
      operationId: list-products
      summary: Elenco prodotti (prezzi e stock casuali, risposta in cache per 20s)
      parameters:
        - name: chaos
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: OK
        "503":
          description: Chaos mode
  /products/{id}/price:
    get:
      operationId: get-price
      summary: Prezzo di un prodotto (richiede header X-Client-Id)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          description: Header X-Client-Id mancante
