openapi: 3.0.1
info:
  title: Orders API
  description: API demo per il talk "APIOps in azione" (Sharp4Dev 2026)
  version: '1.0'
servers:
  - url: https://apim-s4d-dev.azure-api.net/orders
paths:
  /:
    get:
      summary: Elenco ordini
      description: Elenco ordini
      operationId: list-orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - id: string
                  customer: string
                  total: 0
                  status: string
  '/{id}':
    get:
      summary: Dettaglio ordine
      description: Dettaglio ordine
      operationId: get-order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: string
                customer: string
                total: 0
                status: string
        '404':
          description: Non trovato
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customer:
          type: string
        total:
          type: number
        status:
          type: string