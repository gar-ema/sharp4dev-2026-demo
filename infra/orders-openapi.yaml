openapi: "3.0.1"
info:
  title: Orders API
  version: "1.0"
  description: API demo per il talk "APIOps in azione" (Sharp4Dev 2026)
paths:
  /:
    get:
      operationId: list-orders
      summary: Elenco ordini
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /{id}:
    get:
      operationId: get-order
      summary: Dettaglio ordine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Non trovato
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customer:
          type: string
        total:
          type: number
        status:
          type: string
