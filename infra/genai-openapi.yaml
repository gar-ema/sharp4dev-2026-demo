openapi: "3.0.1"
info:
  title: GenAI Chat API
  version: "1.0"
  description: Facciata OpenAI-compatible. In demo risponde con un mock casuale; in produzione punta a un deployment Microsoft Foundry.
paths:
  /chat/completions:
    post:
      operationId: chat-completions
      summary: Chat completion (schema OpenAI)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model:
                  type: string
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                max_tokens:
                  type: integer
      responses:
        "200":
          description: OK
        "429":
          description: Token limit superato
